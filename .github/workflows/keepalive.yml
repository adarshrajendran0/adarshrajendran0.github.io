name: Keep Supabase Active

on:
  schedule:
    # Runs every 3 days at midnight UTC to prevent Supabase 7-day inactivity pause
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://akmawwkmfvvaftlrhmmp.supabase.co/rest/v1/settings?select=id" \
            -H "apikey: sb_publishable_gJ0soXWeAnr9iNFaRQ89Ig_blkKK5Q2" \
            -H "Authorization: Bearer sb_publishable_gJ0soXWeAnr9iNFaRQ89Ig_blkKK5Q2")
          echo "Supabase ping returned HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Supabase is active and responsive."
          else
            echo "Warning: Received HTTP $STATUS"
          fi
