name: Sync Data & Keep Supabase Active

on:
  schedule:
    # Runs daily at midnight UTC
    # 1) Keeps Supabase from pausing (prevents 7-day inactivity pause)
    # 2) Syncs any edits made in the Admin panel to static data/*.json
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest data from Supabase
        run: node scripts/sync-data.js

      - name: Commit and push changes if data updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Static JSON files are already up to date."
          else
            echo "Changes detected in Supabase. Committing updated data..."
            git commit -m "Auto-sync portfolio data from Supabase [skip ci]"
            git push
          fi
